name: Issue 106 validation

on:
  push:
    branches:
      - issue/106-firmware-catalog-simplification

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noc_orchestrator
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: issue-106-validation-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration -- src/lib/firmware-catalog-import.integration.test.ts
      - run: npm run build
