name: Security secret scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  history:
    name: Audit all reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get pinned Gitleaks CLI
        run: |
          mkdir -p /tmp/noc-gitleaks
          curl --fail --silent --show-error --location \
            https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/noc-gitleaks/release.tar.gz
          tar -xzf /tmp/noc-gitleaks/release.tar.gz -C /tmp/noc-gitleaks gitleaks
      - name: Scan historical commits without showing secret values
        run: |
          /tmp/noc-gitleaks/gitleaks detect \
            --source . --log-opts='--all --no-merges' \
            --redact --exit-code=2 --no-banner
