services:
  postgres:
    image: postgres:17-alpine
    container_name: noc-orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: noc_orchestrator_dev
      POSTGRES_USER: noc_orchestrator
      POSTGRES_PASSWORD: noc_orchestrator_dev
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noc_orchestrator -d noc_orchestrator_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - noc-orchestrator-postgres-data:/var/lib/postgresql/data

volumes:
  noc-orchestrator-postgres-data:
