<text x="42" y="400" class="t s">Bouwmaatschappij Van Mierlo</text><text x="290" y="400" class="t s">193</text><text x="370" y="400" class="red s">17</text>
<text x="42" y="424" class="t s">Deutsche Post DHL</text><text x="290" y="424" class="t s">412</text><text x="370" y="424" class="orange s">8</text>

<!-- Panel 2 -->
<rect x="526" y="88" width="482" height="370" rx="10" class="panel"/>
<text x="544" y="120" class="t sh">2. Customer view</text>
<text x="544" y="145" class="m s">Sites within one customer; attention rolls up per site.</text>
<text x="544" y="178" class="t sh">Bouwmaatschappij Van Mierlo</text>
<text x="544" y="200" class="m s">193 devices · 8 sites · 17 need attention</text>
<rect x="544" y="216" width="420" height="36" rx="6" class="card"/><text x="557" y="239" class="m b">Search within this customer…</text>
<text x="544" y="280" class="m s">Site</text><text x="762" y="280" class="m s">Devices</text><text x="842" y="280" class="m s">Attention</text>
<text x="544" y="309" class="t s">Maasdijk</text><text x="770" y="309" class="t s">48</text><text x="850" y="309" class="red s">9</text>
<text x="544" y="336" class="t s">Vlijmen Installaties</text><text x="770" y="336" class="t s">31</text><text x="850" y="336" class="red s">5</text>
<text x="544" y="363" class="t s">Rotterdam</text><text x="770" y="363" class="t s">27</text><text x="850" y="363" class="orange s">3</text>
<text x="544" y="390" class="t s">Zwolle</text><text x="770" y="390" class="t s">42</text><text x="850" y="390" class="green s">Healthy</text>

<!-- Panel 3 -->
<rect x="1028" y="88" width="484" height="370" rx="10" class="panel"/>
<text x="1046" y="120" class="t sh">3. Site view</text>
<text x="1046" y="145" class="m s">Grouped by device type instead of individual records.</text>
<text x="1046" y="178" class="t sh">Maasdijk</text><text x="1046" y="200" class="m s">48 devices · 9 need attention</text>
<rect x="1046" y="218" width="420" height="50" rx="7" class="card"/><text x="1062" y="240" class="t b">Switches · 24</text><text x="1062" y="258" class="red s">6 need attention</text>
<rect x="1046" y="278" width="420" height="50" rx="7" class="card"/><text x="1062" y="300" class="t b">Access Points · 18</text><text x="1062" y="318" class="orange s">2 need attention</text>
<rect x="1046" y="338" width="420" height="50" rx="7" class="card"/><text x="1062" y="360" class="t b">Firewalls · 2</text><text x="1062" y="378" class="red s">1 need attention</text>
<rect x="1046" y="398" width="420" height="42" rx="7" class="card"/><text x="1062" y="423" class="t b">Controllers · 2</text><text x="1356" y="423" class="green s">Healthy</text>

