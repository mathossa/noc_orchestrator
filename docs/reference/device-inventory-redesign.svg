<rect x="42" y="618" width="520" height="36" rx="6" class="card"/><text x="56" y="641" class="m b">Search switches…</text>
<rect x="576" y="618" width="150" height="36" rx="6" class="card"/><text x="590" y="641" class="m s">Needs attention</text>
<text x="42" y="689" class="m s">Device</text><text x="220" y="689" class="m s">Model</text><text x="438" y="689" class="m s">Firmware</text><text x="560" y="689" class="m s">Status</text>
<text x="42" y="722" class="t s">071SWI0004</text><text x="220" y="722" class="t s">WS-C2960X-48FPS-L</text><text x="438" y="722" class="t s">15.2(7)E2</text><text x="560" y="722" class="red s">Update required</text>
<text x="42" y="755" class="t s">071SWI0005</text><text x="220" y="755" class="t s">WS-C2960X-48FPS-L</text><text x="438" y="755" class="t s">15.2(7)E2</text><text x="560" y="755" class="red s">Update required</text>
<text x="42" y="788" class="t s">071SWI0201</text><text x="220" y="788" class="t s">WS-C2960X-48FPS-L</text><text x="438" y="788" class="t s">15.2(7)E2</text><text x="560" y="788" class="red s">Update required</text>
<text x="42" y="821" class="t s">1011SX2-AP002</text><text x="220" y="821" class="t s">Meraki MS390-24P</text><text x="438" y="821" class="t s">MR 32.2.4</text><text x="560" y="821" class="orange s">EOL / Replace</text>
<text x="42" y="888" class="m b">Export available at customer, site and device-group scope.</text>

<!-- Panel 5 -->
<rect x="774" y="480" width="738" height="514" rx="10" class="panel"/>
<text x="792" y="514" class="t sh">5. Device detail</text>
<text x="792" y="539" class="m s">All detailed domain information lives here, not in the main inventory table.</text>
<text x="792" y="579" class="t sh">071SWI0004</text><text x="956" y="579" class="red s">Update required</text>
<text x="792" y="607" class="m s">Overview   Firmware   Planning   Lifecycle   Contract   Source   History</text>
<rect x="792" y="632" width="338" height="252" rx="8" class="card"/>
<text x="808" y="658" class="t b" font-weight="700">Device information</text>
<text x="808" y="686" class="m s">Customer</text><text x="900" y="686" class="t s">Bouwmaatschappij Van Mierlo</text>
<text x="808" y="711" class="m s">Site</text><text x="900" y="711" class="t s">Maasdijk</text>
<text x="808" y="736" class="m s">Type</text><text x="900" y="736" class="t s">Switch</text>
