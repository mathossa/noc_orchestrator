<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#10151d"/>
<style>
  .t{font-family:Inter,Arial,sans-serif;fill:#f2f4f7}.m{font-family:Inter,Arial,sans-serif;fill:#aab4c2}
  .h{font-size:28px;font-weight:700}.sh{font-size:18px;font-weight:700}.b{font-size:14px}.s{font-size:12px}
  .panel{fill:#151b24;stroke:#3a4554;stroke-width:1}.card{fill:#111720;stroke:#303a47;stroke-width:1}
  .red{fill:#ff5b5b}.orange{fill:#ff9f3d}.green{fill:#4fd08b}.blue{fill:#5aa8ff}
</style>
<text x="24" y="38" class="t h">Device Inventory redesign reference</text>
<text x="24" y="64" class="m b">Attention-driven navigation: dashboard → customer → site → device type → devices → device detail</text>

<!-- Panel 1 -->
<rect x="24" y="88" width="482" height="370" rx="10" class="panel"/>
<text x="42" y="120" class="t sh">1. Devices overview</text>
<text x="42" y="145" class="m s">High-level estate view, focused on attention.</text>
<rect x="42" y="164" width="420" height="38" rx="6" class="card"/><text x="56" y="188" class="m b">Search all inventory…</text>
<rect x="42" y="219" width="96" height="82" rx="8" class="card"/><text x="54" y="246" class="t sh">10,284</text><text x="54" y="268" class="m s">Total devices</text>
<rect x="148" y="219" width="96" height="82" rx="8" class="card"/><text x="160" y="246" class="red sh">438</text><text x="160" y="268" class="m s">Need attention</text>
<rect x="254" y="219" width="96" height="82" rx="8" class="card"/><text x="266" y="246" class="blue sh">72</text><text x="266" y="268" class="m s">Unknown</text>
<rect x="360" y="219" width="102" height="82" rx="8" class="card"/><text x="372" y="246" class="orange sh">31</text><text x="372" y="268" class="m s">EOL / Replace</text>
<text x="42" y="326" class="t b" font-weight="700">Customers</text>
<text x="42" y="349" class="m s">Customer</text><text x="282" y="349" class="m s">Devices</text><text x="362" y="349" class="m s">Attention</text>
